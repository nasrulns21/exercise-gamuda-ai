<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Members</title><style>body{font-family:system-ui;margin:0;padding:1rem;background:#eef2ff;color:#1e1b4b}main{max-width:720px;margin:auto}article{background:white;border-radius:12px;padding:1rem;margin:.75rem 0;box-shadow:0 4px 16px #1e1b4b14}</style></head>
<body><main><h1>Our Team</h1><div id="members"></div></main><script type="module">import{teamMembers}from'./team-members.js';document.querySelector('#members').innerHTML=teamMembers.map(m=>`<article><h2>${m.firstName} ${m.lastName}</h2><p><strong>Hobbies:</strong> ${m.hobbies.join(', ')}</p><p><strong>Favourite foods:</strong> ${m.favouriteFoods.join(', ')}</p><p><strong>Pets:</strong> ${m.pets.join(', ')||'None'}</p></article>`).join('')</script></body></html>
