<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete CSS Tutorial - From Basics to Advanced</title>

    <style>

        /* Simple styling for demo boxes */
        .css-example {
            background-color: lightgray;
            padding: 20px;
            margin: 10px;
            border: 2px solid black;
        }

        /* Simple styling for headings */
        .css-example h4 {
            color: black;
        }

    </style>
    <link rel="stylesheet" href="example.css" />
</head>

<body>

    <!-- 1. Inline CSS Example -->
    <div class="css-example">

        <h4>1. Inline CSS Example (Highest Priority):</h4>

        <p style="color: red; font-size: 18px">
            This text uses inline CSS styling : red and 18px
        </p>

    </div>
<!-- 2. Internal CSS Example -->
<div class="css-example">

    <h4>2. Internal CSS Example (Medium Priority):</h4>

    <p class="blue-text">
        This text uses Internal CSS styling : blue and 25px
    </p>

</div>

<style>

    .blue-text {
        color: blue;
        font-weight: bold;
        font-size: 25px;
    }

</style>
<!-- 3. External CSS Example -->
<div class="css-example">

    <h4>3. External CSS Example (Lowest Priority):</h4>

    <p class="external-css">
        This text uses external CSS styling : green and 30px
    </p>

</div>

</body>
</html>
