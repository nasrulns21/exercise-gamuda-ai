<!doctype html><html lang="en"><meta name="viewport" content="width=device-width"><title>Image Insight Lab</title><style>:root{font-family:system-ui;color:#183044;background:#eef4f6}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:2rem 1rem}header{background:#173f4b;color:white;padding:2rem;border-radius:1rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}.card{background:white;padding:1.25rem;border-radius:1rem;border:1px solid #d5e1e5}textarea,input,button{font:inherit;width:100%;padding:.8rem;margin-top:.5rem}button{background:#078673;color:white;border:0;border-radius:.5rem}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><main><header><p>Week 8 multimodal exercise</p><h1>Image Insight Lab</h1><p>Upload an image and customise what the model should inspect.</p></header><div class="grid"><form class="card" id="analysis"><label>Image<input id="image" type="file" accept="image/png,image/jpeg,image/webp" required></label><label>Analysis prompt<textarea id="prompt" required>Describe the important objects, visible text, risks, and recommended actions.</textarea></label><button>Analyse image</button></form><section class="card" aria-live="polite"><h2>Analysis result</h2><p id="result">Choose an image and prompt.</p></section></div></main><script>document.querySelector('#analysis').addEventListener('submit',e=>{e.preventDefault();const f=document.querySelector('#image').files[0],p=document.querySelector('#prompt').value.trim();document.querySelector('#result').textContent=`Fixture request ready: ${f.name} (${f.type}). Prompt: ${p}`})</script></html>
